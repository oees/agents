name: release

# Cut a release by bumping `version` in pyproject.toml on main and pushing a
# matching `v*` tag. The tag is the release: every install runs
# `uvx --from git+https://github.com/oees/agents@<tag>`, and the CLI records
# `v<pyproject version>` as the manifest's `source`. This workflow checks that
# the tag is on main and matches pyproject.toml, then runs `make check`.
# Nothing is published to a package registry.

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: make check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag is a semantic version on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not vMAJOR.MINOR.PATCH[-PRERELEASE]"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag '$TAG' points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
          VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "v$VERSION" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match pyproject.toml version '$VERSION'"
            exit 1
          fi

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install
        run: uv sync --locked

      - name: make check
        run: make check
