[project]
name = "oees-agents"
version = "0.1.0"
description = "Installs the OEES agent conduct, defaults, skills and kits into a project for Claude Code, Cursor and Codex."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "questionary>=2.0",
    "tomli-w>=1.0",
]

[project.scripts]
oees-agents = "oees_agents.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oees_agents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: builds or installs the package; skipped by `make check-fast`"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["PLR2004", "PLR0913"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[tool.ruff.lint.isort]
known-first-party = ["oees_agents"]
known-local-folder = ["conftest"]
