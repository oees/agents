# Local development only; production runs on App Platform from .do/app.yaml.
# First run: cp .env.example .env && docker compose up --build
# Tooling runs in the container: docker compose run --rm app make check
# Or on the host against the compose db: docker compose up -d db && make check-fast

x-app: &app
  build:
    context: .
    target: dev
  # Your host user, so files written into the checkout (caches, coverage, new
  # migrations) stay yours. Set HOST_UID and HOST_GID in .env when they are not 1000.
  user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
  env_file: .env
  environment:
    HOME: /tmp
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  app:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "--loglevel", "INFO"]

  db:
    # Pinned by tag and digest. Bump both together: docker pull <tag> && docker inspect <tag>.
    image: postgres:16.15-alpine@sha256:aa6cb33cf4c19c765cefcf48d96176258800870a9a1e930ad126200f9d825139
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    # For host runs of the gate. Set POSTGRES_PORT in .env when 5432 is in use.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4.12-alpine@sha256:7f7d30b7fdd09467bac58198a1f166dd69789d348d4fe859cccb20e0cf287fbe
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
